name: Website

on:
  push:
    branches: [master, 'website/**']
    paths: ['site/**', '.github/workflows/pages.yml', 'test/check_website*.py', 'util/prepare_website.py', 'examples/water-sto-3g.molden']
  pull_request:
    branches: [master]
    paths: ['site/**', '.github/workflows/pages.yml', 'test/check_website*.py', 'util/prepare_website.py', 'examples/water-sto-3g.molden']
  repository_dispatch:
    types: [website-release-published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare site for the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo smparker/molecular-blender --json tagName --jq .tagName)
          python3 util/prepare_website.py "$tag" _site
      - name: Check links, images, sample, and release ZIP
        run: python3 test/check_website.py _site --downloads
      - name: Test responsive layout and first import in Chromium
        run: |
          python3 -m venv "$RUNNER_TEMP/website-tests"
          source "$RUNNER_TEMP/website-tests/bin/activate"
          pip install playwright==1.65.2
          python test/check_website_browser.py _site --channel chrome
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified website
        id: deployment
        uses: actions/deploy-pages@v4
