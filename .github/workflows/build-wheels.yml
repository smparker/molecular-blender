name: Build Wheels

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test_python_fallback:
    name: Test pure Python fallback without compiled extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Test an isolated copy without binary extensions
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile

          with tempfile.TemporaryDirectory() as temporary:
              for directory in ('molecular_blender', 'test', 'examples', '_setuputils'):
                  shutil.copytree(directory, Path(temporary) / directory,
                                  ignore=shutil.ignore_patterns('*.so', '*.pyd', '__pycache__'))
              for filename in ('run_test.sh', 'blender_setup.py'):
                  shutil.copyfile(filename, Path(temporary) / filename)
              environment = dict(os.environ, PYTHONPATH=os.pathsep.join(
                  (temporary, str(Path(temporary) / 'test'))))
              subprocess.run([sys.executable, '-c',
                              'from molecular_blender import compute_ao, marching_cube; '
                              'assert not compute_ao.CYTHON_ENABLED; '
                              'assert not marching_cube.CYTHON_ENABLED'],
                             cwd=temporary, env=environment, check=True)
              subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'test'],
                             cwd=temporary, env=environment, check=True)
          PY

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: build_sdist
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15-intel, macos-15]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - run: python -m pip install cibuildwheel==3.2.1
      - name: Build and clean-install wheels from the release sdist
        shell: bash
        run: python -m cibuildwheel dist/*.tar.gz --output-dir wheelhouse
      - name: Require every supported standalone ABI
        shell: python
        run: |
          from pathlib import Path
          import sys
          families = {'linux': ['manylinux', 'musllinux'], 'darwin': ['macosx'], 'win32': ['win_amd64']}
          expected = sorted(['cp39', 'cp310', 'cp311', 'cp312', 'cp313', 'cp314'])
          wheels = Path('wheelhouse')
          for family in families[sys.platform]:
              tags = sorted(w.name.split('-')[2] for w in wheels.glob(f'*-{family}*.whl'))
              if tags != expected:
                  raise SystemExit(f'Expected {expected} on {family}, built {tags}')

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  build_blender_addon:
    name: Build universal Blender addon zip
    runs-on: macos-15
    needs: [build_wheels]  # Build after wheels so we can collect all compiled extensions

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: all-wheels
          merge-multiple: true

      - name: Assemble the release ZIP
        shell: bash
        run: |
          for platform in 'manylinux*x86_64' 'win_amd64' 'macosx*arm64' 'macosx*x86_64'; do
            test "$(find all-wheels -name "*-${platform}.whl" | wc -l)" -eq 6
          done
          python -m pip install patchelf==0.19.3.0
          python blender_setup.py export --wheel-dir all-wheels --output molecular_blender.zip

      - name: Upload universal Blender addon
        uses: actions/upload-artifact@v7
        with:
          name: blender-addon-universal
          path: molecular_blender.zip
          if-no-files-found: error
          retention-days: 90

  test_blender_zip:
    name: Install ZIP and render in Blender ${{ matrix.version }} on ${{ matrix.os }}
    needs: build_blender_addon
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['3.6.7', '4.3.2']
        os: [ubuntu-22.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-blender
        with:
          version: ${{ matrix.version }}
      - uses: actions/download-artifact@v8
        with:
          name: blender-addon-universal
          path: ${{ runner.temp }}/addon
      - name: Verify native extensions, water ESP, materials and orbital render
        shell: python
        env:
          BLENDER_VERSION: ${{ matrix.version }}
        run: |
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          root = Path(os.environ['GITHUB_WORKSPACE'])
          archive = Path(os.environ['RUNNER_TEMP']) / 'addon/molecular_blender.zip'
          with tempfile.TemporaryDirectory() as tmp:
              scripts = Path(tmp) / 'scripts'
              (scripts / 'addons').mkdir(parents=True)
              config = Path(tmp) / 'config'
              config.mkdir()
              env = dict(os.environ, BLENDER_USER_SCRIPTS=str(scripts), BLENDER_USER_CONFIG=str(config))
              subprocess.run([env['BLENDER_BIN'], '-b', '--factory-startup', '--python-exit-code', '1',
                              '--python', root / 'test/blender_release_zip.py', '--', archive,
                              env['BLENDER_VERSION']], cwd=tmp, env=env, check=True)

  create_release_assets:
    name: Create release with wheels and Blender addons
    needs: [build_wheels, build_sdist, build_blender_addon, test_blender_zip]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/wheels-*/*.whl
            artifacts/sdist/*.tar.gz
            artifacts/blender-addon-universal/*.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          body: |
            ## Installation

            ### For Blender Users

            Download **`molecular_blender.zip`** - this single zip file works on all platforms (Linux, macOS, Windows).

            **Installation steps:**
            1. Download `molecular_blender.zip` (do not extract it!)
            2. In Blender: **Edit → Preferences → Add-ons → Install**
            3. Select the downloaded zip file
            4. Enable **Import-Export: Molecular Blender**

            The zip includes pre-compiled extensions for all platforms. Blender will automatically use the correct ones for your system.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

