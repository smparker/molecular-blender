name: Build Wheels

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120  # 2 hours max per platform
    strategy:
      fail-fast: false  # Don't cancel other jobs if one fails
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]
        # macos-13 is Intel, macos-14 is Apple Silicon

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper versioning

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.16.5

      - name: Prepare setup file for wheel building
        shell: bash
        run: |
          # Backup original setup.py and use setup_wheels.py for building
          if [ -f setup.py ]; then
            mv setup.py setup_dev.py
          fi
          cp setup_wheels.py setup.py

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Restore original setup.py
        if: always()
        shell: bash
        run: |
          # Restore the original setup.py
          if [ -f setup_dev.py ]; then
            mv setup_dev.py setup.py
          fi

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          retention-days: 30

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build numpy cython

      - name: Prepare setup file for sdist
        shell: bash
        run: |
          # Backup original setup.py and use setup_wheels.py for building
          if [ -f setup.py ]; then
            mv setup.py setup_dev.py
          fi
          cp setup_wheels.py setup.py

      - name: Build sdist
        run: python -m build --sdist

      - name: Restore original setup.py
        if: always()
        shell: bash
        run: |
          # Restore the original setup.py
          if [ -f setup_dev.py ]; then
            mv setup_dev.py setup.py
          fi

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 30

  build_blender_addon:
    name: Build universal Blender addon zip
    runs-on: ubuntu-latest
    needs: [build_wheels]  # Build after wheels so we can collect all compiled extensions

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: all-wheels
          merge-multiple: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cython numpy wheel

      - name: Extract compiled extensions from wheels
        shell: bash
        run: |
          mkdir -p compiled_extensions

          echo "Available wheels:"
          ls -lh all-wheels/*.whl || echo "No wheels found!"

          # Extract .so and .pyd files from all wheels
          for wheel in all-wheels/*.whl; do
            if [ -f "$wheel" ]; then
              echo "Extracting from $wheel"
              unzip -q "$wheel" "molecular_blender/*.so" -d compiled_extensions/ 2>/dev/null || true
              unzip -q "$wheel" "molecular_blender/*.pyd" -d compiled_extensions/ 2>/dev/null || true
            fi
          done

          # Show what we extracted (grouped by extension name for clarity)
          echo ""
          echo "=== Extracted extensions by Python version and platform ==="
          find compiled_extensions -name "*.so" -o -name "*.pyd" | sort
          echo ""
          echo "Total extensions: $(find compiled_extensions -name "*.so" -o -name "*.pyd" | wc -l)"

      - name: Build base addon (no compilation)
        run: |
          # Build addon without compiling (we'll add compiled extensions separately)
          python setup.py export

      - name: Create universal addon with all platform extensions
        shell: bash
        run: |
          # Find the created zip
          BASE_ZIP=$(ls molecular_blender_*.zip | head -n 1)
          echo "Base zip: $BASE_ZIP"

          # Create a temp directory to assemble the universal addon
          mkdir -p universal_addon

          # Extract base zip
          unzip -q "$BASE_ZIP" -d universal_addon/

          # Copy all compiled extensions into the addon
          if [ -d "compiled_extensions/molecular_blender" ]; then
            cp compiled_extensions/molecular_blender/*.so universal_addon/molecular_blender/ 2>/dev/null || true
            cp compiled_extensions/molecular_blender/*.pyd universal_addon/molecular_blender/ 2>/dev/null || true
          fi

          # Show what's included
          echo ""
          echo "=== Universal addon compiled extensions ==="
          find universal_addon/molecular_blender/ -name "*.so" -o -name "*.pyd" | sort || echo "No compiled extensions found (will use pure Python fallback)"
          echo ""
          echo "Total extensions in universal zip: $(find universal_addon/molecular_blender/ -name "*.so" -o -name "*.pyd" | wc -l)"
          echo ""
          echo "Python versions covered:"
          find universal_addon/molecular_blender/ -name "*.so" -o -name "*.pyd" | sed -E 's/.*cpython-([0-9]+).*/Python 3.\1/' | sort -u || true

          # Create the universal zip
          cd universal_addon
          zip -q -r "../molecular_blender.zip" molecular_blender/
          cd ..

          # Clean up
          rm -rf universal_addon "$BASE_ZIP"

          echo "Created universal addon: molecular_blender.zip"
          ls -lh molecular_blender.zip

      - name: Upload universal Blender addon
        uses: actions/upload-artifact@v4
        with:
          name: blender-addon-universal
          path: molecular_blender.zip
          retention-days: 30

  test_wheels:
    name: Test wheels on ${{ matrix.os }} with Python ${{ matrix.python }}
    needs: [build_wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.10', '3.11', '3.12']
        # Limit test matrix to avoid excessive CI time
        exclude:
          - os: macos-latest
            python: '3.9'
          - os: windows-latest
            python: '3.9'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Install wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          # Find and install the appropriate wheel for this platform/python
          python -m pip install --find-links=wheelhouse --no-index molecular_blender || echo "No wheel found for this platform/python combination"

      - name: Run wheel tests
        run: |
          # Run comprehensive test suite that tests Cython extensions
          # without requiring bpy (which is only available in Blender)
          python test_wheel.py || echo "⚠ Tests skipped - no wheel for this combination"

  upload_pypi:
    name: Upload to PyPI (if release)
    needs: [build_wheels, build_sdist, build_blender_addon, test_wheels]
    runs-on: ubuntu-latest
    # Only upload to PyPI on release
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          # Remove this line to publish to real PyPI
          # repository-url: https://test.pypi.org/legacy/

  create_release_assets:
    name: Create release with wheels and Blender addons
    needs: [build_wheels, build_sdist, build_blender_addon]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/wheels-*/*.whl
            artifacts/sdist/*.tar.gz
            artifacts/blender-addon-universal/*.zip
          draft: false
          prerelease: false
          body: |
            ## Installation

            ### For Blender Users

            Download **`molecular_blender.zip`** - this single zip file works on all platforms (Linux, macOS, Windows).

            **Installation steps:**
            1. Download `molecular_blender.zip` (do not extract it!)
            2. In Blender: **Edit → Preferences → Add-ons → Install**
            3. Select the downloaded zip file
            4. Enable **Import-Export: Molecular Blender**

            The zip includes pre-compiled extensions for all platforms. Blender will automatically use the correct ones for your system.

            ### For Python Developers

            Download and install the wheel (`.whl`) file for your platform and Python version:
            ```bash
            pip install molecular_blender-*.whl
            ```

            Or install from PyPI:
            ```bash
            pip install molecular_blender
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

