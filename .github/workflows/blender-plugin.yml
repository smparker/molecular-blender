name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  bond-reference:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Compare bond orders with RDKit
      run: |
        python -m pip install numpy rdkit==2026.3.6
        python -c "from rdkit.Chem import rdDetermineBonds"
        python -m unittest discover -v -s test -p test_bond_perception.py

  build:
    name: Source suite in Blender ${{ matrix.blender }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - blender: '3.6.7'
            python: '3.10'
          - blender: '4.3.2'
            python: '3.11'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: ./.github/actions/setup-blender
        with:
          version: ${{ matrix.blender }}
      - name: Build all kernels for the running Blender ABI
        run: |
          python -m pip install -r requirements.txt
          python blender_setup.py build --blender "$BLENDER_BIN"
      - name: Verify native selection and run the complete suite
        run: |
          "$BLENDER_BIN" -b --factory-startup --python-exit-code 1 --python-expr \
            "import sys; sys.path.insert(0, '.'); from molecular_blender import compute_ao_cy, esp_kernel, marching_cube_cy"
          bash run_test.sh -b "$BLENDER_BIN"
