title: Gallery
bg: purple
color: black
fa-icon: photo
---

<h2>In print</h2>
<div class="publication-art">
  {% for image in site.data.toc %}
    <figure>
      <a href="https://doi.org/{{ image.doi }}">
        <img src="img/{{ image.src }}" alt="{{ image.alt }}" loading="lazy">
      </a>
      <figcaption>{{ image.caption }}</figcaption>
    </figure>
  {% endfor %}
</div>
