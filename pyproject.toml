[build-system]
requires = [
    "setuptools>=45",
    "wheel",
    "Cython>=0.29.0",
    "numpy>=1.19.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "molecular_blender"
dynamic = ["version"]
description = "Blender addon for molecular visualization with quantum chemistry support"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
authors = [
    {name = "Shane Parker"}
]
keywords = ["blender", "molecular", "visualization", "chemistry", "quantum"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "numpy>=1.19.0",
]

[project.urls]
Homepage = "https://github.com/smparker/molecular-blender"
Repository = "https://github.com/smparker/molecular-blender"
Issues = "https://github.com/smparker/molecular-blender/issues"

[tool.cibuildwheel]
# Build for Python 3.9 through 3.14 (covering all recent Blender versions)
# Python 3.9: Blender 3.0-3.1
# Python 3.10: Blender 3.2-3.6
# Python 3.11: Blender 4.0-4.1
# Python 3.12: Blender 4.2+
# Python 3.13, 3.14: Future Blender versions
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"

# Skip 32-bit builds (not needed for modern Blender)
skip = [
    "*-win32",           # Skip 32-bit Windows
    "*-manylinux_i686",  # Skip 32-bit Linux
    "*-musllinux_i686",  # Skip 32-bit musllinux
    "pp*",               # Skip PyPy
]

# Test that the wheels work correctly using our test suite
# Note: We use test_wheel.py which tests Cython extensions without requiring bpy
test-command = "python {project}/test_wheel.py"

# Skip tests on emulated architectures (ARM on x86, etc.)
test-skip = "*-*linux_{aarch64,ppc64le,s390x} *-macosx_arm64 *-macosx_universal2:arm64"

# Additional build environment variables
[tool.cibuildwheel.environment]
# Ensure numpy is available during build
PIP_PREFER_BINARY = "1"

# macOS-specific settings
[tool.cibuildwheel.macos]
# Build for both Intel and Apple Silicon
archs = ["x86_64", "arm64"]
# macOS deployment target - support back to 10.13
environment = {MACOSX_DEPLOYMENT_TARGET = "10.13"}

# Linux-specific settings
[tool.cibuildwheel.linux]
# Use manylinux_2_28 (AlmaLinux 8 - newer, avoids CentOS 7 EOL issues)
# This provides good compatibility for modern Linux systems (glibc 2.28+, ~2018+)
# which covers all systems that can run modern Blender versions
# Only build x86_64 for now - aarch64 uses QEMU emulation which is very slow (10-20x)
# and times out in GitHub Actions. Enable aarch64 if needed for native ARM Linux systems.
archs = ["x86_64"]
build-frontend = "build"
# Use the newer manylinux_2_28 image based on AlmaLinux 8
manylinux-x86_64-image = "manylinux_2_28"
# Before building, ensure we have a C++ compiler
before-all = "yum install -y gcc-c++ || apk add g++"

# Windows-specific settings
[tool.cibuildwheel.windows]
archs = ["AMD64"]
# MSVC is used by default on Windows

