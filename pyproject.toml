[build-system]
requires = [
    "setuptools>=77.0.3",
    "wheel",
    "Cython>=3.0",
    "numpy>=2.0,<3",
]
build-backend = "setuptools.build_meta"

[project]
name = "molecular_blender"
dynamic = ["version"]
description = "Blender addon for molecular visualization with quantum chemistry support"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
authors = [
    {name = "Shane Parker"}
]
keywords = ["blender", "molecular", "visualization", "chemistry", "quantum"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "numpy>=1.19.0",
]

[project.urls]
Homepage = "https://github.com/smparker/molecular-blender"
Repository = "https://github.com/smparker/molecular-blender"
Issues = "https://github.com/smparker/molecular-blender/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["molecular_blender*"]

[tool.cibuildwheel]
# Standalone wheel ABIs. Blender extensions must match its bundled interpreter.
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"

# cibuildwheel installs each repaired wheel in a fresh environment.
test-command = "python {project}/test/test_wheel.py"
test-skip = "*-macosx_x86_64"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["native"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
